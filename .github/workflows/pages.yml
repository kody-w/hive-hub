name: Verify and deploy static Hive Hub

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: 20.18.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build-only dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify deterministic public surface
        run: npm run verify

      - name: Verify published records against the Python core
        env:
          PYTHONPATH: src:.
        run: python -B -m unittest tests.test_published_record_conformance

      - name: Verify public privacy boundary
        run: python -B scripts/check_public_release.py

      - name: Verify receipt history against pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run check:receipts -- --base "origin/$BASE_REF"

      - name: Verify receipt history against previous main
        if: github.event_name == 'push'
        run: npm run check:receipts -- --base HEAD^

      - name: Require committed generated output
        run: |
          if test -n "$(git status --porcelain -- .nojekyll .well-known api hub index.html llms.txt)"; then
            git status --short -- .nojekyll .well-known api hub index.html llms.txt
            echo "Generated public output is not committed or is stale." >&2
            exit 1
          fi

      - name: Build isolated Pages artifact
        run: npm run build:site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
